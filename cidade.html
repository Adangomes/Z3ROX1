<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade dos Devs - Vale do Itapocu 🏗️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(18, 24, 38, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            z-index: 10;
            width: 300px;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            color: #38bdf8;
        }
        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #cbd5e1;
        }
        input, select {
            width: 100%;
            padding: 8px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 5px;
        }
        button:hover {
            opacity: 0.9;
        }
        #stats {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #334155;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>🏙️ Cidade dos Devs</h1>
        <p>Cada commit faz seu prédio subir no Vale do Itapocu!</p>
        
        <div class="input-group">
            <label>Seu Nome / Dev</label>
            <input type="text" id="devName" value="Adalberto">
        </div>

        <div class="input-group">
            <label>Stack Principal</label>
            <select id="devStack">
                <option value="react">React / JavaScript (Neon)</option>
                <option value="python">Python / IA (Futurista)</option>
                <option value="hardware">Hardware / IoT (Industrial)</option>
            </select>
        </div>

        <button id="commitBtn">🚀 Fazer Commit (+1 Andar)</button>

        <div id="stats">
            <div>Andares construídos: <strong id="floorCount">1</strong></div>
            <div>Commits totais: <strong id="commitCount">1</strong></div>
        </div>
    </div>

    <!-- Carregando a biblioteca Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. CONFIGURAÇÃO DA CENA 3D ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);
        scene.fog = new THREE.FogExp2(0x0b0f19, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 20, 25);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Chão (O Vale)
        const planeGeo = new THREE.PlaneGeometry(100, 100);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // Grade de ruas
        const grid = new THREE.GridHelper(100, 20, 0x3b82f6, 0x334155);
        grid.position.y = 0.01;
        scene.add(grid);

        // --- 2. CONSTRUÇÃO DO PRÉDIO DO DEV ---
        let floors = 1;
        let commits = 1;
        
        // Cores baseadas na stack
        const stackColors = {
            react: 0x38bdf8,   // Azul Ciano
            python: 0x10b981,  // Verde Esmeralda
            hardware: 0xf59e0b // Laranja Industrial
        };

        let currentHeight = 0.8;
        let currentWidth = 2.5;
        let currentDepth = 2.5;

        // Grupo principal do prédio
        const buildingGroup = new THREE.Group();
        scene.add(buildingGroup);

        function createFloor(isBase = false) {
            const stack = document.getElementById('devStack').value;
            const color = stackColors[stack];

            const geometry = new THREE.BoxGeometry(currentWidth, 0.8, currentDepth);
            const material = new THREE.MeshStandardMaterial({ 
                color: isBase ? 0x334155 : color, 
                roughness: 0.2,
                metalness: 0.8
            });
            
            const floorMesh = new THREE.Mesh(geometry, material);
            floorMesh.position.y = (floors * 0.8) - 0.4;
            floorMesh.castShadow = true;
            floorMesh.receiveShadow = true;
            
            buildingGroup.add(floorMesh);
        }

        // Criar o andar inicial
        createFloor(true);

        // --- 3. INTERAÇÃO (BOTÃO DE COMMIT) ---
        const commitBtn = document.getElementById('commitBtn');
        const floorCountEl = document.getElementById('floorCount');
        const commitCountEl = document.getElementById('commitCount');

        commitBtn.addEventListener('click', () => {
            floors++;
            commits++;
            
            createFloor(false);

            // Atualiza UI
            floorCountEl.innerText = floors;
            commitCountEl.innerText = commits;

            // Animação leve da câmera subindo com o prédio
            camera.position.y += 0.4;
        });

        // Redimensionamento da janela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 4. LOOP DE RENDERIZAÇÃO ---
        function animate() {
            requestAnimationFrame(animate);

            // Deixa a cidade girando de leve para dar vida
            buildingGroup.rotation.y += 0.002;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
