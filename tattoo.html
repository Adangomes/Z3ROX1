h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;line-height:1.02;margin:0}
h1{font-size:clamp(44px,9vw,104px);font-style:italic}

h3{font-size:28px;margin-bottom:6px}
p{margin:0 0 14px;max-width:62ch}
section{padding:96px 0}
.rv{clip-path:circle(var(--r,0%) at 50% 0%);will-change:clip-path}
.bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--ink);transform-origin:0 50%;transform:scaleX(0);z-index:70}
.nav{position:fixed;top:0;left:0;right:0;z-index:60;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px;transition:background .3s,backdrop-filter .3s}
.nav.on{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.nav nav{display:flex;align-items:center;gap:22px;font-weight:500;font-size:15px}
.nav nav a{text-decoration:none;opacity:.8}.nav nav a:hover{opacity:1}
.nav .btn{padding:9px 18px;font-size:14px;opacity:1}
@media (max-width:640px){.nav nav a:not(.btn){display:none}}
.hero{min-height:100svh;display:flex;align-items:center;position:relative;overflow:hidden;padding:90px 0 50px}
.hero-bg{position:absolute;inset:-6% 0;background-size:cover;background-position:center;opacity:.24;filter:grayscale(1) contrast(1.1);transform:translateY(var(--py,0px))}

@keyframes mq{to{transform:translateX(-50%)}}
.styles{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:34px}
.st{border-top:3px solid var(--ink);padding:18px 0 6px}

.grid{columns:3 240px;column-gap:14px;margin-top:34px}

.card{background:var(--card);padding:26px;border-radius:6px;border-top:3px solid var(--ink)}

.faq summary::after{content:"+";color:var(--ink);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}

.cta{position:relative;text-align:center;background:var(--ink);color:#fff;padding:120px 0 110px;margin-top:70px}

.wa{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:8px;background:#1fa855;color:#fff;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.35);transition:transform .25s}

.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .3s}
.lb img{max-height:84svh;max-width:92vw;object-fit:contain}
.lb p{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;margin:0 auto}

.lb .x{top:calc(14px + env(safe-area-inset-top,0px));right:16px}.lb .pv{left:14px;top:50%}.lb .nx{right:14px;top:50%}
@keyframes fi{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.rv{clip-path:none!important}.drop-hero,.cur{display:none}.w>i{animation:none;transform:none}.fade{animation:none;opacity:1}.mq div{animation:none}html{scroll-behavior:auto}*{transition:none!important}}
</style>

  addEventListener('scroll',on,{passive:true});addEventListener('resize',on);upd();

  return()=>{removeEventListener('scroll',on);removeEventListener('resize',on);removeEventListener('pointermove',mv)};
