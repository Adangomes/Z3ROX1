<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniChamada — Vídeo pitch</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1250;--fg:#f4f5ff;--mut:#aab0f0;--a:#7f8cff;--b:#ff7aa8;--c:#3ce0c2;--y:#ffd21f;--u:min(1vw,1.7778vh)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#050824;overflow:hidden;font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--fg)}
body{display:grid;place-items:center}
#stage{position:relative;width:calc(var(--u)*100);height:calc(var(--u)*56.25);overflow:hidden;background:radial-gradient(120% 90% at 85% 10%,#1d2a9a 0%,var(--bg) 55%)}
.fx{position:absolute;border-radius:50%;opacity:.16;border:calc(var(--u)*.35) solid var(--col);animation:fl 14s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(calc(var(--u)*6),calc(var(--u)*-4)) rotate(90deg)}}
.sc{position:absolute;inset:0;padding:calc(var(--u)*6) calc(var(--u)*7) calc(var(--u)*9);display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*2.4);opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
.sc.on{opacity:1;visibility:visible}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*5)}
h2{font-weight:800;letter-spacing:-.03em;line-height:1.02;font-size:calc(var(--u)*6.2)}
.big{font-size:calc(var(--u)*8.6);max-width:14em}
.p{font-size:calc(var(--u)*2.5);line-height:1.35;color:var(--mut);max-width:28em}
.y{color:var(--y)}
.r{opacity:0}.on .r{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.22s + .2s)}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--u)*3))}to{opacity:1;transform:none}}
.g{display:grid;gap:calc(var(--u)*2.2);grid-template-columns:repeat(var(--n),1fr)}
.st i{display:grid;place-items:center;width:calc(var(--u)*5);height:calc(var(--u)*5);border-radius:50%;background:var(--a);color:#fff;font-style:normal;font-weight:800;font-size:calc(var(--u)*2.6);margin-bottom:calc(var(--u)*1)}
.st b,.cd b{display:block;font-size:calc(var(--u)*2.3);margin-bottom:.25em}
.st span,.cd span{display:block;font-size:calc(var(--u)*1.7);line-height:1.3;color:var(--mut)}
.cd{border-top:calc(var(--u)*.6) solid var(--col);padding-top:calc(var(--u)*1.2)}
.num{font-weight:800;font-size:calc(var(--u)*8);line-height:1;color:var(--y)}
.num+span{display:block;color:var(--mut);font-size:calc(var(--u)*1.9)}
.link{font-size:calc(var(--u)*3.4);font-weight:800;color:var(--y)}
.qr{position:relative;display:grid;grid-template-columns:repeat(13,1fr);gap:calc(var(--u)*.25);width:calc(var(--u)*27);aspect-ratio:1;padding:calc(var(--u)*1.2);background:var(--bg);border:calc(var(--u)*.6) solid var(--fg);border-radius:calc(var(--u)*1.4);overflow:hidden;flex:none}
.qr u{background:var(--fg);border-radius:2px;transition:opacity .35s}.qr u.z{opacity:0}
.qr b{position:absolute;left:0;right:0;height:.5%;min-height:4px;background:var(--y);box-shadow:0 0 18px 4px var(--y);animation:sc 2.4s ease-in-out infinite alternate}
@keyframes sc{from{top:0}to{top:calc(100% - 5px)}}
#cap{position:absolute;left:calc(var(--u)*7);right:calc(var(--u)*7);bottom:calc(var(--u)*3);font-size:calc(var(--u)*1.8);line-height:1.35;color:var(--fg);text-align:center;z-index:3;text-shadow:0 2px 10px #000}
#prog{position:absolute;left:0;bottom:0;height:calc(var(--u)*.45);width:100%;background:var(--y);transform-origin:0 50%;transform:scaleX(0);transition:transform .6s;z-index:4}
#intro{position:absolute;inset:0;z-index:6;background:rgba(5,8,36,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.6);text-align:center;padding:calc(var(--u)*4)}
#intro h1{font-size:calc(var(--u)*7);font-weight:800;letter-spacing:-.03em}
#intro small{font-size:calc(var(--u)*1.5);color:var(--mut);max-width:44em}
button,select{font:inherit;font-size:calc(var(--u)*1.8);padding:.5em 1em;border-radius:999px;border:2px solid #ffffff40;background:transparent;color:var(--fg);cursor:pointer}
select{max-width:90%;background:#0c1250}
button.go{background:var(--y);color:#10145a;border-color:var(--y);font-weight:800;font-size:calc(var(--u)*2.4)}
button:focus-visible,select:focus-visible{outline:3px solid var(--y);outline-offset:3px}
#bar{position:absolute;top:calc(var(--u)*1.5);right:calc(var(--u)*1.5);z-index:5;display:flex;gap:calc(var(--u)*.8);transition:opacity .4s}
body.pl #bar{opacity:0}body.pl:hover #bar,body.pl #bar:focus-within{opacity:1}
label{font-size:calc(var(--u)*1.6);color:var(--mut)}
@media (prefers-reduced-motion:reduce){.fx,.qr b{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div class="fx" style="--col:var(--b);width:calc(var(--u)*14);height:calc(var(--u)*14);left:4%;top:62%"></div>
  <div class="fx" style="--col:var(--c);width:calc(var(--u)*9);height:calc(var(--u)*9);left:46%;top:6%;animation-delay:-5s"></div>
  <div class="fx" style="--col:var(--y);width:calc(var(--u)*18);height:calc(var(--u)*18);right:-3%;top:58%;animation-delay:-9s"></div>
  <div id="scenes"></div>
  <p id="cap"></p><div id="prog"></div>
  <div id="bar"><button id="pp">⏸ Pausar</button><button id="rs">↻ Reiniciar</button><button id="fs">⛶ Tela cheia</button></div>
  <div id="intro">
    <h1>UniChamada — vídeo pitch</h1>
    <small>Cerca de 1 minuto, com narração por voz do aparelho e legenda. Para gravar: ative a gravação de tela com som do sistema e toque em Assistir.</small>
    <select id="vz" aria-label="Voz"></select>
    <label><input type="checkbox" id="mu"> Sem voz (só legenda)</label>
    <button class="go" id="go">▶ Assistir com narração</button>
    <small>As vozes mudam conforme o aparelho. Se a voz soar feminina, escolha outra na lista (ex.: Daniel no iPhone e Mac, Antonio no Edge).</small>
  </div>
</div>
<script>
/* ===== EDITE AQUI: f = fala (vira a legenda), b = visual da cena ===== */
const qr=()=>{let h='<div class="qr r" style="--i:2">';for(let k=0;k<169;k++)h+='<u></u>';return h+'<b></b></div>'};
const st=(a,b,k)=>`<div class="st r" style="--i:${k+1}"><i>${k+1}</i><b>${a}</b><span>${b}</span></div>`;
const cd=(a,b,k,c)=>`<div class="cd r" style="--i:${k+1};--col:var(--${c})"><b>${a}</b><span>${b}</span></div>`;
const SC=[
{f:'Quanto tempo da sua aula some na chamada? Lista em papel, nome por nome, e ainda tem colega assinando por quem faltou.',
 b:`<h2 class="r big">Quanto da sua aula some na chamada?</h2><p class="r p" style="--i:2">Lista em papel, nome por nome. Assinatura por colega ausente. Presença em que ninguém confia.</p>`},
{f:'Conheça o UniChamada: uma chamada que se faz sozinha. O professor projeta um QR Code, o aluno confirma pelo celular, e a presença aparece na hora.',
 b:`<div class="row"><div><h2 class="r big">UniChamada</h2><p class="r p" style="--i:1">Uma chamada que se faz sozinha. O professor projeta, o aluno confirma, a presença aparece na hora.</p></div>${qr()}</div>`},
{f:'São cinco passos. O aluno lê o QR Code, informa o RA e o e-mail, mostra o rosto para a câmera, o GPS confere se ele está a até cem metros da sala, e por fim digita o código do telão.',
 b:`<h2 class="r">Cinco passos para confirmar a presença</h2><div class="g" style="--n:5">${st('Lê o QR','Abre a confirmação da aula',0)}${st('RA e e-mail','Confere se é aluno da turma',1)}${st('Rosto','Captura pela câmera',2)}${st('GPS','Até 100 m da sala',3)}${st('Código do telão','Último passo',4)}</div>`},
{f:'E contra fraude? O código do telão muda a cada trinta segundos, então foto de tela não adianta. O GPS barra quem está fora da sala, e toda alteração de presença fica registrada com justificativa.',
 b:`<h2 class="r">Contra fraude</h2><div class="g" style="--n:4">${cd('Código rotativo','Muda a cada 30 segundos. Repassar não adianta.',0,'y')}${cd('GPS','O aluno precisa estar no local da aula.',1,'c')}${cd('Câmera','Registra o rosto de quem confirma.',2,'b')}${cd('Auditoria','Todo ajuste guarda uma justificativa.',3,'a')}</div>`},
{f:'São três perfis de acesso. O coordenador cuida de cursos, turmas e matrículas. O professor controla a chamada e o histórico. E o aluno só confirma a própria presença.',
 b:`<h2 class="r">Três perfis de acesso</h2><div class="g" style="--n:3">${cd('Coordenador','Cursos, disciplinas, turmas, professores, alunos e matrículas.',0,'y')}${cd('Professor','Abre e encerra a chamada, vê o histórico e ajusta com justificativa.',1,'c')}${cd('Aluno','Confirma a própria presença com as validações de segurança.',2,'b')}</div>`},
{f:'Por trás, não tem servidor próprio nem framework. É HTML, CSS e JavaScript puros, com banco, login e tempo real no Supabase, publicado de graça no GitHub Pages. São mais de noventa commits.',
 b:`<h2 class="r">Simples por dentro</h2><div class="g" style="--n:3"><div class="r" style="--i:1"><div class="num">0</div><span>frameworks no front-end</span></div><div class="r" style="--i:2"><div class="num">93</div><span>commits no repositório</span></div><div class="r" style="--i:3"><div class="num">3</div><span>perfis de acesso</span></div></div><p class="r p" style="--i:4">HTML · CSS · JavaScript · Supabase · GitHub Pages</p>`},
{f:'UniChamada, feito por Adalberto e Diego, do curso de Análise e Desenvolvimento de Sistemas. O código é aberto e está no GitHub. Vem conhecer.',
 b:`<h2 class="r big">UniChamada</h2><p class="r p" style="--i:1">Feito por Adalberto e Diego<br>Análise e Desenvolvimento de Sistemas</p><p class="r link" style="--i:2">github.com/Adangomes/UNICHAMADA</p>`}
];
/* ===== MOTOR ===== */
const $=s=>document.querySelector(s);
$('#scenes').innerHTML=SC.map(s=>`<section class="sc">${s.b}</section>`).join('');
const els=[...document.querySelectorAll('.sc')];
/* QR animado */
const cells=[...document.querySelectorAll('.qr')].map(q=>[...q.children].filter(u=>u.tagName==='U'));
cells.forEach(c=>c.forEach((u,k)=>{const r=Math.floor(k/13),o=k%13;if((r<3&&(o<3||o>9))||(r>9&&o<3))return;if(Math.random()<.5)u.classList.add('z');u.dyn=1}));
setInterval(()=>cells.forEach(c=>{for(let j=0;j<7;j++){const u=c[Math.floor(Math.random()*169)];if(u.dyn)u.classList.toggle('z')}}),260);
/* voz */
const TTS='speechSynthesis' in window;let voice=null;
function loadVoices(){if(!TTS)return;const vs=speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang)),sel=$('#vz');
 sel.innerHTML=vs.length?vs.map((v,k)=>`<option value="${k}">${v.name} (${v.lang})</option>`).join(''):'<option>Voz padrão do aparelho</option>';
 const m=vs.findIndex(v=>/daniel|felipe|ant[oô]nio|ricardo|luciano|jorge/i.test(v.name));if(m>=0)sel.value=m;
 voice=vs[sel.value]||null;sel.onchange=()=>voice=vs[sel.value]||null}
loadVoices();if(TTS)speechSynthesis.onvoiceschanged=loadVoices;
function say(t,done){let fin=false;const f=()=>{if(!fin){fin=true;done()}},ms=t.length*62+1200;
 if($('#mu').checked||!TTS){setTimeout(f,ms);return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';if(voice)u.voice=voice;u.rate=.98;u.pitch=.85;
 u.onend=f;u.onerror=f;speechSynthesis.speak(u);setTimeout(f,ms+6000)}
/* reprodução */
let cur=0,run=0,on=false;
function show(i){cur=i;els.forEach((e,k)=>e.classList.toggle('on',k===i));$('#cap').textContent=SC[i].f;$('#prog').style.transform=`scaleX(${(i+1)/SC.length})`}
function play(i){const id=++run;if(i>=SC.length){on=false;$('#pp').textContent='↻ Rever';cur=SC.length-1;return}
 show(i);say(SC[i].f,()=>{if(id===run)setTimeout(()=>{if(id===run)play(i+1)},900)})}
function start(i){on=true;document.body.classList.add('pl');$('#pp').textContent='⏸ Pausar';play(i)}
$('#go').onclick=()=>{$('#intro').remove();start(0)};
$('#pp').onclick=()=>{if(on){run++;if(TTS)speechSynthesis.cancel();on=false;$('#pp').textContent='▶ Continuar';document.body.classList.remove('pl')}else start(cur>=SC.length-1&&$('#pp').textContent==='↻ Rever'?0:cur)};
$('#rs').onclick=()=>{run++;if(TTS)speechSynthesis.cancel();start(0)};
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
</script>
</body>
</html>
