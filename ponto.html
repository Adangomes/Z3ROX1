<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem de Ponto - Reconhecimento de Crachá</title>
    <!-- Biblioteca leve para leitura de QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .scanner-box {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #feedback {
            font-size: 1.5rem;
            font-weight: bold;
            min-height: 40px;
            text-align: center;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Aproxime seu Crachá da Câmera</h2>
        <div class="scanner-box">
            <video id="preview-video" playsinline></video>
            <canvas id="canvas-hidden" style="display: none;"></canvas>
        </div>
        <div id="feedback" class="info">Aguardando leitura...</div>
    </div>

    <script>
        const video = document.getElementById('preview-video');
        const canvasElement = document.getElementById('canvas-hidden');
        const canvas = canvasElement.getContext('2d', { willReadFrequently: true });
        const feedback = document.getElementById('feedback');

        let ultimoCodigoLido = null;
        let bloqueioLeitura = false; // Evita múltiplos registros seguidos do mesmo crachá

        // Iniciar Câmera Frontal
        async function iniciarCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" } // "user" ativa a câmera frontal
                });
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                requestAnimationFrame(escanearFrame);
            } catch (err) {
                console.error("Erro ao acessar a câmera:", err);
                feedback.innerText = "Erro: Permissão de câmera negada ou indisponível.";
                feedback.className = "error";
            }
        }

        // Loop de varredura contínua
        function escanearFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code && !bloqueioLeitura) {
                    processarPonto(code.data);
                }
            }
            requestAnimationFrame(escanearFrame);
        }

        // Enviar dados para o Backend em tempo real (Sem Refresh)
        async function processarPonto(dadosQrCode) {
            bloqueioLeitura = true;
            feedback.innerText = "Processando...";
            feedback.className = "info";

            try {
                // Exemplo de requisição para sua API / Supabase / Node.js
                const response = await fetch('/api/registrar-ponto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ qr_hash: dadosQrCode, timestamp: new Date().toISOString() })
                });

                const resultado = await response.json();

                if (response.ok) {
                    feedback.innerText = `Ponto Registrado: ${resultado.nomeFuncionario}`;
                    feedback.className = "success";
                } else {
                    feedback.innerText = resultado.mensagem || "Funcionário não encontrado!";
                    feedback.className = "error";
                }
            } catch (error) {
                console.error("Erro de conexão:", error);
                feedback.innerText = "Erro de conexão com o servidor.";
                feedback.className = "error";
            }

            // Libera para nova leitura após 3 segundos
            setTimeout(() => {
                feedback.innerText = "Aguardando leitura...";
                feedback.className = "info";
                bloqueioLeitura = false;
            }, 3000);
        }

        // Inicializa ao carregar a página
        window.addEventListener('load', iniciarCamera);
    </script>
</body>
</html>
