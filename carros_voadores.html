<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla CyberFlyer - Frota dos Devs (Vale do Itapocu)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050814;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
            width: 320px;
        }
        h1 {
            font-size: 1.1rem;
            margin: 0 0 5px 0;
            color: #38bdf8;
        }
        p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
            color: #cbd5e1;
        }
        input, select {
            width: 100%;
            padding: 7px 10px;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 0.85rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 9px;
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 5px;
            font-size: 0.85rem;
        }
        button:hover {
            opacity: 0.9;
        }
        #github-radar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
            display: none;
            z-index: 10;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        #github-radar h3 {
            margin: 0 0 5px 0;
            color: #38bdf8;
            font-size: 1rem;
        }
        #github-radar p {
            margin: 0;
            color: #e2e8f0;
            font-size: 0.9rem;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #94a3b8;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>🛸 Tesla CyberFlyer (Devs)</h1>
        <p>Cadastre o dev e pilote o carro voador no céu!</p>
        
        <div class="input-group">
            <label>Nome do Dev</label>
            <input type="text" id="devName" value="Adalberto">
        </div>

        <div class="input-group">
            <label>Usuário do GitHub</label>
            <input type="text" id="devGithub" value="adalberto-dev">
        </div>

        <div class="input-group">
            <label>Selecionar Carro (Piloto Atual)</label>
            <select id="carSelect">
                <option value="0">Carro de Adalberto</option>
            </select>
        </div>

        <button id="addCarBtn">➕ Cadastrar Novo Carro</button>
        <button id="loginBtn" style="background: linear-gradient(135deg, #10b981 0%, #047857 100%);">🎮 Entrar e Pilotar Este Carro</button>
    </div>

    <div id="controls-hint">
        <b>Comandos de Voo:</b><br>
        W / S: Frente / Ré<br>
        A / D: Virar Esquerda / Direita<br>
        Espaço / Shift: Subir / Descer
    </div>

    <div id="github-radar">
        <h3 id="radarTitle">📡 Veículo Próximo Detectado!</h3>
        <p id="radarInfo">GitHub: github.com/dev</p>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. CONFIGURAÇÃO DA CENA 3D ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050814);
        scene.fog = new THREE.FogExp2(0x050814, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Luzes
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1);
        dirLight.position.set(20, 50, 20);
        scene.add(dirLight);

        // Chão (O Vale do Itapocu visto de cima)
        const planeGeo = new THREE.PlaneGeometry(200, 200);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        const grid = new THREE.GridHelper(200, 40, 0x0ea5e9, 0x1e293b);
        grid.position.y = 0.05;
        scene.add(grid);

        // --- 2. SISTEMA DE CARROS VOADORES ---
        const cars = [];
        let activeCarIndex = 0;

        function createFlyingCar(name, github, x, z) {
            const carGroup = new THREE.Group();

            // Corpo futurista do CyberFlyer
            const bodyGeo = new THREE.BoxGeometry(2, 0.6, 4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9, roughness: 0.1 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.3;
            carGroup.add(body);

            // Asas / Propulsores laterais
            const wingGeo = new THREE.BoxGeometry(4.5, 0.1, 1.2);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0284c7, emissiveIntensity: 0.5 });
            const wings = new THREE.Mesh(wingGeo, wingMat);
            wings.position.y = 0.3;
            carGroup.add(wings);

            // Teto de vidro cockpit
            const glassGeo = new THREE.BoxGeometry(1.4, 0.5, 2);
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6 });
            const glass = new THREE.Mesh(glassGeo, glassMat);
            glass.position.set(0, 0.6, 0.2);
            carGroup.add(glass);

            carGroup.position.set(x, 2, z);
            scene.add(carGroup);

            cars.push({
                mesh: carGroup,
                name: name,
                github: github,
                speed: 0,
                turnSpeed: 0
            });

            updateCarSelect();
        }

        // Criar carros iniciais de exemplo na cidade
        createFlyingCar("Adalberto", "adalberto-dev", 0, 0);
        createFlyingCar("Cleiton (Guaramirim)", "cleiton-code", 15, -20);
        createFlyingCar("Mariana (Schroeder)", "mari-tech", -20, 15);

        function updateCarSelect() {
            const select = document.getElementById('carSelect');
            select.innerHTML = '';
            cars.forEach((car, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.text = `Carro de ${car.name} (${car.github})`;
                select.appendChild(opt);
            });
            select.value = activeCarIndex;
        }

        // --- 3. BOTÕES DE CADASTRO E LOGIN ---
        document.getElementById('addCarBtn').addEventListener('click', () => {
            const name = document.getElementById('devName').value;
            const github = document.getElementById('devGithub').value;
            // Posição aleatória no mapa
            const rx = (Math.random() - 0.5) * 60;
            const rz = (Math.random() - 0.5) * 60;
            createFlyingCar(name, github, rx, rz);
            alert(`Carro voador de ${name} cadastrado com sucesso no céu!`);
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            activeCarIndex = parseInt(document.getElementById('carSelect').value);
            alert(`Logado no carro de ${cars[activeCarIndex].name}! Use W, A, S, D para voar.`);
        });

        // --- 4. CONTROLES DE VOO (TECLADO) ---
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // --- 5. LOOP DE ANIMAÇÃO E RADAR DE PROXIMIDADE ---
        const radarBox = document.getElementById('github-radar');
        const radarInfo = document.getElementById('radarInfo');
        const radarTitle = document.getElementById('radarTitle');

        function animate() {
            requestAnimationFrame(animate);

            // Movimentação do carro ativo
            const currentCar = cars[activeCarIndex];
            if (currentCar) {
                if (keys['w'] || keys['arrowup']) currentCar.speed = 0.3;
                else if (keys['s'] || keys['arrowdown']) currentCar.speed = -0.15;
                else currentCar.speed *= 0.92; // Inércia

                if (keys['a'] || keys['arrowleft']) currentCar.mesh.rotation.y += 0.03;
                if (keys['d'] || keys['arrowright']) currentCar.mesh.rotation.y -= 0.03;

                if (keys[' ']) currentCar.mesh.position.y += 0.15; // Subir
                if (keys['shift']) currentCar.mesh.position.y = Math.max(1, currentCar.mesh.position.y - 0.15); // Descer

                // Move pra frente na direção que o carro está apontando
                currentCar.mesh.translateZ(-currentCar.speed);

                // Câmera persegue o carro voador por trás (visão em terceira pessoa estilo jogo)
                const offset = new THREE.Vector3(0, 3, 7).applyAxisAngle(new THREE.Vector3(0, 1, 0), currentCar.mesh.rotation.y);
                camera.position.lerp(currentCar.mesh.position.clone().add(offset), 0.1);
                camera.lookAt(currentCar.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)));
            }

            // Radar de Proximidade: verifica se o carro ativo chegou perto de outro
            let detected = false;
            if (currentCar) {
                for (let i = 0; i < cars.length; i++) {
                    if (i === activeCarIndex) continue;
                    const otherCar = cars[i];
                    const distance = currentCar.mesh.position.distanceTo(otherCar.mesh.position);

                    // Se chegar a menos de 8 metros de distância no ar
                    if (distance < 8) {
                        radarTitle.innerText = `📡 Veículo de ${otherCar.name} Próximo!`;
                        radarInfo.innerHTML = `GitHub: <b>github.com/${otherCar.github}</b><br><span style="font-size:0.75rem; color:#94a3b8;">Distância: ${distance.toFixed(1)}m</span>`;
                        radarBox.style.display = 'block';
                        detected = true;
                        break;
                    }
                }
            }
            if (!detected) {
                radarBox.style.display = 'none';
            }

            renderer.render(scene, camera);
        }
        animate();

        // Responsivo
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
